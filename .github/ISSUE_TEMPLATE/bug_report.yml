name: Bug Report
description: Report broken behavior in AURA-Cyber
title: "bug: <short summary>"
labels:
  - bug
body:
  - type: input
    id: module
    attributes:
      label: Affected module
      placeholder: aura-cce-engine
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Include the exact Maven command if relevant (e.g. `mvn -pl <module> test -Dtest=<Class>`).
      render: shell
    validations:
      required: true
  - type: input
    id: java-version
    attributes:
      label: Java / environment
      placeholder: "Java 25, Windows 11"
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched open and closed issues for a duplicate
          required: true
